notes:

* >

  The original XSL selector contains both the structural MML condition
  and legacy CustomExclusions/BaseExclusions logic.

* >

  The deterministic Select-Xml validation identifies the structural
  candidate first. Candidate-level exclusion evaluation is performed
  using AgentRules/Exclusions.yaml before reporting a confirmed violation.

* >

  CustomExclusions and BaseExclusions are retained in original_logic
  for traceability to the legacy XSL only and are not runtime exclusion
  sources for the current AgentRule.

* >

  The validation XPath is intentionally limited to the structural
  candidate conditions from the original MML rule. It must not introduce
  a different XML structure or additional runtime exclusion mechanism.

* >

  ParameterType is retained because it is part of the original MML
  reporting semantics and can be used as deterministic evidence for the
  matched field.

* >

  File and folder exclusions are handled by the generic
  ApplicationCompliance Skill through AgentRules/FileFolderExclusions.yaml
  before this rule's validation is executed.

* >

  Candidate-level exclusions are handled through
  AgentRules/Exclusions.yaml after candidate generation.

* >


expected:
condition: >
Public string fields that are subject to MML validation must have a
valid MaxLength definition according to the original MML selection
semantics, unless excluded by an applicable entry in
AgentRules/Exclusions.yaml.

violation:
when: >
A public string field under model/object[@id='data'] is not schema
excluded, has no definition/options, is not inside a group whose id
contains 'NonShredded', and has a missing or empty MaxLength definition
according to the original MML XPath semantics, and is not excluded by
an applicable entry in AgentRules/Exclusions.yaml.


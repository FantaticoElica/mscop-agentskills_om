notes:
  - >
    The original XSL contains multiple selectors and search expressions
    used by the legacy Big Int Fields implementation. These are retained
    in original_logic and inspected_selectors for traceability.

  - >
    The deterministic Select-Xml validation identifies the structural
    BIF candidate set using the primary selector. Candidate-level
    exclusion evaluation is performed using AgentRules/Exclusions.yaml
    before reporting a confirmed violation.

  - >
    CustomExclusions and BaseExclusions are retained in original_logic
    for traceability to the legacy XSL only and are not runtime
    exclusion sources for the current AgentRule.

  - >
    The validation XPath must remain semantically aligned with the
    executable BIF rule and must not introduce additional XML conditions
    that are not defined by the AgentRule.

  - >
    Generated skeletons must not overwrite manually curated rule semantics.
